services:
  copyparty:
    image: copyparty/ac:latest
    container_name: copyparty
    restart: unless-stopped
    environment:
      - TZ=${TZ}
    command:
      - -c
      - /etc/copyparty/copyparty.conf
      - -a
      - admin:${COPYPARTY_PASSWORD}
    volumes:
      - ./copyparty.conf:/etc/copyparty/copyparty.conf:ro
      - copyparty_data:/w
      - copyparty_state:/state
    networks:
      - proxy

volumes:
  copyparty_data:
  copyparty_state:

networks:
  proxy:
    external: true
